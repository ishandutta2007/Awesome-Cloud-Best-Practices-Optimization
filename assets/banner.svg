<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <!-- Cloud Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 800; font-size: 42px; fill: url(#textGrad); }
    .subtitle { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; }
    .badge-text { font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; font-size: 14px; font-weight: 600; fill: #e2e8f0; }

    /* Animated background pulses */
    @keyframes float1 {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.05); opacity: 0.6; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }
    @keyframes float2 {
      0% { transform: translateY(0px) scale(1); opacity: 0.2; }
      50% { transform: translateY(12px) scale(0.95); opacity: 0.5; }
      100% { transform: translateY(0px) scale(1); opacity: 0.2; }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .cloud-bg-1 { animation: float1 6s ease-in-out infinite; }
    .cloud-bg-2 { animation: float2 8s ease-in-out infinite; }
    .flow-line { stroke-dasharray: 8, 8; animation: dash 2s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="1200" height="350" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.25">
    <line x1="0" y1="70" x2="1200" y2="70"/>
    <line x1="0" y1="140" x2="1200" y2="140"/>
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="200" y1="0" x2="200" y2="350"/>
    <line x1="400" y1="0" x2="400" y2="350"/>
    <line x1="600" y1="0" x2="600" y2="350"/>
    <line x1="800" y1="0" x2="800" y2="350"/>
    <line x1="1000" y1="0" x2="1000" y2="350"/>
  </g>

  <!-- Dynamic / Animated Background Graphics (Behind text) -->
  <g class="cloud-bg-1" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.3" filter="url(#glow)">
    <circle cx="150" cy="100" r="60"/>
    <circle cx="1050" cy="250" r="80"/>
    <path d="M 100,280 Q 250,220 400,280 T 700,260 T 1100,290" class="flow-line"/>
  </g>
  <g class="cloud-bg-2" fill="none" stroke="#c084fc" stroke-width="2" opacity="0.2" filter="url(#glow)">
    <circle cx="1000" cy="80" r="50"/>
    <circle cx="200" cy="260" r="70"/>
    <path d="M 50,80 Q 300,150 550,70 T 1050,110" class="flow-line"/>
  </g>

  <!-- Foreground Title and Subtitle -->
  <g transform="translate(600, 145)" text-anchor="middle">
    <!-- Icon -->
    <path d="M -30,-45 C -45,-45 -55,-35 -55,-20 C -65,-20 -72,-12 -72,0 C -72,12 -62,20 -50,20 L 50,20 C 62,20 72,12 72,0 C 72,-10 65,-18 55,-20 C 53,-35 40,-45 25,-45 C 18,-45 10,-42 5,-36 C 0,-42 -10,-45 -30,-45 Z" fill="none" stroke="url(#textGrad)" stroke-width="4" filter="url(#glow)" transform="translate(0, -25) scale(0.7)"/>
    
    <!-- Title -->
    <text y="35" class="title">Awesome Cloud Best Practices &amp; Optimization ☁️</text>
    
    <!-- Subtitle -->
    <text y="75" class="subtitle">Architectural Governance • FinOps • Cost Rightsizing • Security Assessment</text>

    <!-- Decorative Badges / Floating Elements in Foreground Bottom -->
    <g transform="translate(0, 120)">
      <g transform="translate(-240, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="badge-text">⚡ FinOps</text>
      </g>
      <g transform="translate(-80, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#1e293b" stroke="#818cf8" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="badge-text">🛡️ Security Posture</text>
      </g>
      <g transform="translate(90, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#1e293b" stroke="#c084fc" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="badge-text">📊 Rightsizing</text>
      </g>
      <g transform="translate(250, 0)">
        <rect x="-60" y="-14" width="120" height="28" rx="14" fill="#1e293b" stroke="#4ade80" stroke-width="1.5"/>
        <text x="0" y="4" text-anchor="middle" class="badge-text">🔓 Open Source</text>
      </g>
    </g>
  </g>
</svg>
