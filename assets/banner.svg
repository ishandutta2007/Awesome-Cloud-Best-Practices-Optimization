<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 350"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0f172a"/><stop offset="50%" stop-color="#1e1b4b"/><stop offset="100%" stop-color="#0f172a"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feComposite in="SourceGraphic" in2="blur" operator="over"/></filter></defs><style>@keyframes float1{0%{transform:translateY(0) scale(1);opacity:.3}50%{transform:translateY(-15px) scale(1.05);opacity:.6}}@keyframes float2{0%{transform:translateY(0) scale(1);opacity:.2}50%{transform:translateY(12px) scale(.95);opacity:.5}}.badge-text,.subtitle,.title{font-family:&apos;Segoe UI&apos;,system-ui,-apple-system,sans-serif}.title{font-weight:800;font-size:42px;fill:url(#textGrad)}.subtitle{font-weight:500;font-size:20px;fill:#94a3b8}.badge-text{font-size:14px;font-weight:600;fill:#e2e8f0}.cloud-bg-1{animation:float1 6s ease-in-out infinite}.cloud-bg-2{animation:float2 8s ease-in-out infinite}.flow-line{stroke-dasharray:8,8;animation:dash 2s linear infinite}</style><rect width="1200" height="350" fill="url(#bgGrad)" rx="16"/><g stroke="#334155" stroke-width="1" opacity=".25"><line x1="0" x2="1200" y1="70" y2="70"/><line x1="0" x2="1200" y1="140" y2="140"/><line x1="0" x2="1200" y1="210" y2="210"/><line x1="0" x2="1200" y1="280" y2="280"/><line x1="200" x2="200" y1="0" y2="350"/><line x1="400" x2="400" y1="0" y2="350"/><line x1="600" x2="600" y1="0" y2="350"/><line x1="800" x2="800" y1="0" y2="350"/><line x1="1000" x2="1000" y1="0" y2="350"/></g><g fill="none" stroke="#38bdf8" stroke-width="2" class="cloud-bg-1" filter="url(#glow)" opacity=".3"><circle cx="150" cy="100" r